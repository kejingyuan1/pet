server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pet-park-server
  datasource:
    # Docker 部署：DB_HOST=mysql（compose 服务名）/ DB_PORT=3306 / DB_USER / DB_PASSWORD / DB_NAME
    # 本地开发：不设环境变量则用默认 localhost/root/123456
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pet_park}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never            # 表结构由 MySQL 容器 /docker-entrypoint-initdb.d/schema.sql 初始化

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 自定义配置
petpark:
  jwt:
    # 生产环境务必替换为强随机密钥（至少 32 字节），可用环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:pet-park-secret-key-please-change-me-0123456789abcdef}
    expire-hours: 168          # token 有效期（小时），默认 7 天
  register:
    # 注册邀请码（用户须填对才能注册）
    invite-code: dudu2019
  ai:
    # 通义千问（DashScope）答疑：API Key 用环境变量 DASHSCOPE_API_KEY 注入
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-turbo
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  cors:
    allowed-origins:
      - http://localhost:8899
      - http://127.0.0.1:8899
      - http://localhost:4200
      - http://localhost:8081

logging:
  level:
    com.petpark: info
