server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pet-park-server
  datasource:
    # Docker 部署：DB_HOST=mysql（compose 服务名）/ DB_PORT=3306 / DB_USER / DB_PASSWORD / DB_NAME
    # 本地开发：不设环境变量则用默认 localhost/root/123456
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pet_park}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never            # 表结构由 MySQL 容器 /docker-entrypoint-initdb.d/schema.sql 初始化

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 自定义配置
petpark:
  jwt:
    # 生产环境务必替换为强随机密钥（至少 32 字节），可用环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:pet-park-secret-key-please-change-me-0123456789abcdef}
    expire-hours: 168          # token 有效期（小时），默认 7 天
  register:
    # 注册邀请码（用户须填对才能注册）
    invite-code: dudu2019
  ai:
    # AI 答疑（OpenAI 兼容接口，兼容 CodeBuddy CLI / DashScope / DeepSeek 等网关）
    # API Key 环境变量：AI_API_KEY 或 CODEBUDDY_API_KEY / CODEBUDDY_AUTH_TOKEN / DASHSCOPE_API_KEY
    api-key: ${AI_API_KEY:${CODEBUDDY_API_KEY:${CODEBUDDY_AUTH_TOKEN:${DASHSCOPE_API_KEY:}}}}
    # 模型：AI_MODEL 或 CODEBUDDY_MODEL 覆盖（如 deepseek-v4-flash）
    model: ${AI_MODEL:${CODEBUDDY_MODEL:deepseek-v4-flash}}
    # OpenAI 兼容网关地址：AI_BASE_URL 或 CODEBUDDY_BASE_URL 覆盖
    base-url: ${AI_BASE_URL:${CODEBUDDY_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
    # 是否使用 response_format=json_object（部分网关不支持，可设 AI_JSON_MODE=false）
    json-mode: ${AI_JSON_MODE:true}
    # 认证方式：x-api-key（CodeBuddy/DashScope sk-）/ bearer（OpenAI/DeepSeek 官方）
    auth-mode: ${AI_AUTH_MODE:x-api-key}
  cors:
    allowed-origins:
      - http://localhost:8899
      - http://127.0.0.1:8899
      - http://localhost:4200
      - http://localhost:8081

logging:
  level:
    com.petpark: info
