server:
  port: 8080

spring:
  application:
    name: pet-park-server
  datasource:
    url: jdbc:mysql://localhost:3306/pet_park?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never            # 首次启动可改为 always 自动执行 schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 自定义配置
petpark:
  jwt:
    # 生产环境务必替换为强随机密钥（至少 32 字节）
    secret: pet-park-secret-key-please-change-me-0123456789abcdef
    expire-hours: 168          # token 有效期（小时），默认 7 天
  cors:
    allowed-origins:
      - http://localhost:8899
      - http://127.0.0.1:8899

logging:
  level:
    com.petpark: debug
